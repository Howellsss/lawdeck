# One-off admin job (rule Q-03): copies library originals that are not archived yet into the
# protected archive. Run by hand: Actions -> "Archive library originals" -> Run workflow.
name: Archive library originals

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    name: Archive library originals (real Supabase project)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run job:archive
