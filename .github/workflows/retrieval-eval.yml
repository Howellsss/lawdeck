# The retrieval test (step 2d): compares the Voyage models on the 30 Civil Litigation questions.
# Run by hand from Actions → "Retrieval test" → Run workflow. It costs a few cents per run.
name: Retrieval test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval:
    name: Retrieval test (real Supabase project and Voyage AI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval:retrieval
