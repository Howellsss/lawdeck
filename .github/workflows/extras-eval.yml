# The memory aids test (Remembrance Phase 2): a made-up lesson written into memory aids and stories
# by Opus with the real prompt, then checked (tests/eval/extras.eval.ts). Runs when the memory aid
# instructions or rules change, or by hand from Actions → "Memory aids test" → Run workflow. About
# 10–20 cents a run. Prints only results, never the written text (public repository).
name: Memory aids test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/prompts/extras.ts
      - src/server/ai/extras.ts
      - src/schemas/extras.ts
      - src/lib/extrasRules.ts
      - tests/eval/extras.eval.ts
      - tests/eval/extras/**

permissions:
  contents: read

jobs:
  extras:
    name: Memory aids test (Claude Opus)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # The "Lawdeck API" workspace (not secret); needed because the key is a personal sk-ant-usr key.
      ANTHROPIC_WORKSPACE_ID: wrkspc_0128BwXP23kGYCu9QkS6AJ1H
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval:extras
