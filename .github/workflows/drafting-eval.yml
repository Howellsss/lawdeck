# The drafting test (step 5d): one made-up document drafted by Opus with the real prompt, checked
# for stand-ins, word limits, nothing invented and speed. Run by hand from Actions → "Drafting test"
# → Run workflow. About 5 cents a run. Prints only results, never the drafted text (public repository).
name: Drafting test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drafting:
    name: Drafting test (Claude Haiku)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # The "Lawdeck API" workspace (not secret); needed because the key is a personal sk-ant-usr key.
      ANTHROPIC_WORKSPACE_ID: wrkspc_0128BwXP23kGYCu9QkS6AJ1H
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval:drafting
